<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}">
  </head>

  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title }}</a>

        <nav class="site-nav">
          <input type="checkbox" id="nav-trigger" class="nav-trigger" />
          <label for="nav-trigger">
            <span class="menu-icon">
              <svg viewBox="0 0 18 15" width="18px" height="15px">
                <path fill="currentColor"
                  d="M1,1 L17,1 L17,3 L1,3 L1,1 Z M1,6 L17,6 L17,8 L1,8 L1,6 Z M1,11 L17,11 L17,13 L1,13 L1,11 Z" />
              </svg>
            </span>
          </label>

          <div class="trigger">
            {% for my_page in site.pages %}
              {% if my_page.title and my_page.nav_exclude != true %}
                <a class="page-link" href="{{ my_page.url | relative_url }}">{{ my_page.title }}</a>
              {% endif %}
            {% endfor %}
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p><strong>LEAP Lab Logistics Documentation Portal</strong></p>
        <p>Maintained by the <strong>LEAP Lab Logistics Team</strong></p>
        <p>Contact: <a href="mailto:sriramg@iisc.ac.in">sriramg@iisc.ac.in</a></p>
      </div>
    </footer>
  </body>
</html>
